# Sentinel Configuration
# This file configures server + client defaults.
# User-specific overrides go in .sentinel.yaml (not tracked in git)

heatmap:
  # Timeframe in milliseconds (must match on server + client)
  timeframe: 1000

  # Grid dimensions
  grid_width: 2048   # Time columns (history depth)
  grid_height: 1024  # Price buckets

  # Initial viewport (client only)
  initial_viewport_pct: 10  # Time zoom (% of grid width)
  # initial_price_pct: auto  # Price zoom (omit for square cells)

  # Price grid
  tick_size: 1.0  # Fixed tick size (0 = dynamic)
  recenter_delta: 0.01
  band_fast: 0.15
  band_medium: 0.25
  band_slow: 0.35

  # Intensity normalization (server-side)
  intensity_mode: log          # log | linear | power
  intensity_max_mode: running  # running | column
  intensity_max_decay: 0.995
  intensity_log_scale: 1000.0
  intensity_power: 0.4
  intensity_floor: 0.001
  debug_slice_log: false

  # Visual settings (client only)
  gamma: 1.05
  contrast: 1.15
  # label_px: 24  # Min cell height for labels
  label_px: 9999  # Disable labels

server:
  # Market data connection
  mdc:
    host: advanced-trade-ws.coinbase.com
    port: 443
    target: /v1
    use_jwt: false
    ssl_ca_bundle: resources/certs/ca-bundle.crt

  # Auto-subscribe symbols on startup for server, client still needs to subscribe manually
  default_symbols: BTC-USD

  # Candle stream gating (server-side)
  candles:
    update_bps_fast: 0.00005      # 0.5 bps
    update_bps_slow: 0.0002       # 2 bps
    update_tick_mult_fast: 1
    update_tick_mult_slow: 2
    update_silence_ms_fast: 200
    update_silence_ms_slow: 1000
    update_volume_fast: 0.0       # disabled
    update_volume_slow: 0.0       # disabled
    update_tick_size: 0.0         # 0 = use SENTINEL_ORDERBOOK_TICK_SIZE

gui:
  # Screenshot API
  screenshot_dir: ./screenshots
  api_port: 17100



