# Alerts A1 and A3 of docs/research/2026-10-observability.md section 3 (slice 1).
# A2 (product L2 silent while connected) waits for the per-product L2 age metric;
# A4 (capture queue, T7 full, disk errors) for the capture /metrics (slice 2).
#
# Shape: query A (instant PromQL on VictoriaMetrics) -> threshold C. Annotation
# templates use {{ .Labels.x }} (no '$': Grafana expands environment variables
# in provisioning files).
apiVersion: 1
groups:
  - orgId: 1
    name: sentinel-health
    folder: Sentinel
    interval: 30s
    rules:
      # A1: a pinned symbol x layer stopped committing minute columns while the
      # upstream is connected. The gauge is the stall monitor's own deadline
      # (next column due = last column bucket + 2 min + lateness); 60 s past due
      # is when the log warns "Recording v2 stalled". Absent while disconnected.
      - uid: sentinel-a1-recorder-stalled
        title: A1 recorder stalled
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "Recorder stalled: {{ .Labels.product }} {{ .Labels.layer }}"
          description: >-
            No new minute column for {{ .Labels.product }} {{ .Labels.layer }}: the next column is
            {{ printf "%.0f" .Values.A.Value }} s past due with the upstream connected (FM-121 / FM-127 / FM-138).
            Read ~/Library/Logs/Sentinel/sentinel-server-latest.log. Do not kickstart the
            recorder while T7 I/O is frozen.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: sentinel-vm
            model:
              refId: A
              expr: max by (product, layer) (sentinel_recorder_column_overdue_seconds)
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [60] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }

      # A1b: the upstream has been down for 5 min, so nothing records and A1 is
      # silent by design (its gauge is absent while disconnected).
      - uid: sentinel-a1b-upstream-down
        title: A1b recorder upstream disconnected
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "Recorder upstream disconnected for 5 min"
          description: >-
            sentinel-server reports a pinned (recorded) product's market-data connection down
            (sentinel_mdc_connected == 0) for 5 minutes; that product is not being recorded. GUI
            chart products never move this gauge. Check Transport down / reconnect lines with
            product= in the server log.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: sentinel-vm
            model:
              refId: A
              expr: sentinel_mdc_connected{job="sentinel-server"}
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }

      # A3a: a required scrape target is down or missing: process dead, crash
      # loop (exit 75 when T7 is unmounted), a main thread frozen so hard it
      # cannot answer /metrics, or the job gone from the scrape config.
      # One sample per required job, so a single missing job still fires:
      #   healthy            -> up = 1 for both jobs               -> OK
      #   failed scrape      -> up{job} = 0                        -> fires for that job
      #   one job missing    -> its up series is absent; absent(up{job="x"}) = 1
      #                         (labels job="x" from the matcher), minus 1 = 0 -> fires for job x
      #   empty datasource   -> both absent() terms = 0            -> fires for both jobs
      #   VictoriaMetrics down -> query error -> execErrState Error -> Grafana's
      #                         DatasourceError notification through the same policy
      # absent() is empty for a job that has an up series, so a healthy job yields
      # only its up sample. Add a job here when it becomes required.
      - uid: sentinel-a3-target-down
        title: A3 service down
        condition: C
        for: 2m
        noDataState: Alerting # cannot happen with the absent() terms; kept as a backstop
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "Service down: {{ .Labels.job }}"
          description: >-
            Scrape of {{ .Labels.job }} failing or missing for 2 minutes. For
            sentinel-server read ~/Library/Logs/Sentinel/launchd-recorder.err and the latest run
            log; exit 75 means the recording directory (T7) is not usable.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: sentinel-vm
            model:
              refId: A
              expr: >-
                up{job=~"sentinel-server|node"}
                or (absent(up{job="sentinel-server"}) - 1)
                or (absent(up{job="node"}) - 1)
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }

      # A3b: T7 is not mounted (its filesystem series is absent). Also fires
      # when node_exporter itself is down, beside A3a for job=node.
      - uid: sentinel-a3b-t7-absent
        title: A3b T7 absent
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "T7 not mounted"
          description: >-
            node_filesystem_avail_bytes{mountpoint="/Volumes/T7"} has been absent for 5 minutes.
            The recorder and capture cannot write; the recorder exits 75 and launchd retries.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: sentinel-vm
            model:
              refId: A
              expr: absent(node_filesystem_avail_bytes{mountpoint="/Volumes/T7"})
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
