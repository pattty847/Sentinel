# Dashboards are files in the repo (SENTINEL_REPO comes from the launchd plist).
# UI edits are allowed but live only in Grafana's database and are overwritten when the
# file changes: export the JSON into grafana/dashboards/ and commit to keep them.
apiVersion: 1
providers:
  - name: sentinel
    orgId: 1
    folder: Sentinel
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: ${SENTINEL_REPO}/ops/monitoring/grafana/dashboards
