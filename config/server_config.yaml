schema_version: 1
heatmap:
  timeframes_ms: [1000, 60000, 300000, 900000, 3600000, 14400000, 86400000]
  timeframe: 60000
  grid_width: 8192
  grid_height: 2048
  tick_size: 5
  recenter_delta: 0.01
  persistence_enabled: true
  persistence_dir: data/heatmap
  persistence_fsync_every_n_records: 1
  persistence_fsync_every_ms: 1000
  persistence_retention_days: 0
orderbook:
  tick_size: 0.1
  band_pct: 0.3
recording:
  enabled: true
  dir: /Volumes/T7/sentinel-data/recording
  fallback_dir: data/recording
  near_tick: 1        # $ rows within near_pct of the mid (follows the mid)
  near_pct: 0.05
  deep_tick: 10       # $ rows across [mid*deep_low_frac, mid*deep_high_mult]
  deep_low_frac: 0.25
  deep_high_mult: 4
  size_floor: 1.0e-8   # BTC base increment; codes span 1e-8 .. ~11k BTC per row at 0.085%
candles:
  update_bps_fast: 5e-05
  update_bps_slow: 0.0002
  update_tick_mult_fast: 1
  update_tick_mult_slow: 2
  update_silence_ms_fast: 200
  update_silence_ms_slow: 1000
  update_volume_fast: 0
  update_volume_slow: 0
  update_tick_size: 0
default_symbols: [BTC-USD]
