schema_version: 1
heatmap:
  timeframes_ms: [1000, 60000, 300000, 900000, 3600000, 14400000, 86400000]
  timeframe: 60000
  grid_width: 8192
  grid_height: 2048
  tick_size: 5
  recenter_delta: 0.01
  persistence_enabled: true
  persistence_dir: data/heatmap
  persistence_fsync_every_n_records: 1
  persistence_fsync_every_ms: 1000
  persistence_retention_days: 0
trade_overlays:
  grid_width: 512
  grid_height: 2048
  tick_size: 5
  footprint_timeframe_ms: 60000
orderbook:
  tick_size: 0.1
  band_pct: 0.3
recording:
  enabled: true
  dir: /Volumes/T7/sentinel-data/recording
  fallback_dir: data/recording
  near_tick: 1        # $ rows within near_pct of the mid (follows the mid)
  near_pct: 0.05
  deep_tick: 5       # $ rows across [mid*deep_low_frac, mid*deep_high_mult]
  deep_low_frac: 0.25
  deep_high_mult: 4
  size_floor: 1.0e-8   # BTC base increment; codes span 1e-8 .. ~11k BTC per row at 0.085%
  live_publish_ms: 500 # open-minute live publication interval (2 Hz; owner 2026-10-01); clamped to [250, 5000]
candles:
  update_bps_fast: 5e-05
  update_bps_slow: 0.0002
  update_tick_mult_fast: 1
  update_tick_mult_slow: 2
  update_silence_ms_fast: 200
  update_silence_ms_slow: 1000
  update_volume_fast: 0
  update_volume_slow: 0
  update_tick_size: 0
default_symbols: [BTC-USD]

# Pinned default_symbols are exempt; refuse new GUI products beyond this cap.
mdc:
  max_connections: 8

# Shadow pipeline: primary recording/ and client stream remain authoritative.
# Enable only in deployed config after choosing a UTC-midnight journal start.
roller_shadow:
  enabled: false
  journal_dir: /Volumes/T7/sentinel-data/raw-l2
  dir: /Volumes/T7/sentinel-data/hmc2
  socket: "" # ~/Sentinel-runtime/run/capture.sock
  from: "2026-10-03T00:00:00Z"
