# Client Configuration
# Copy to config/client_config.yaml and customize your settings.
# User-specific overrides go in config/.client_config.yaml (not tracked in git).

heatmap:
  # Visual settings (client only)
  gamma: 1.05
  contrast: 1.15
  shader_floor: 0.01
  show_volume_bars: true
  volume_band_percent: 22   # Price-pane share (10..40)
  volume_opacity: 0.45      # Muted direction colours (0.1..1.0)
  candle_body_fraction: 0.85 # Body share of a column (0.3..1.0)
  candle_max_body_px: 71     # Maximum body width in logical pixels (5..120)

  # Initial viewport (client only)
  initial_column_px: 8      # Time zoom on connect: screen pixels per heatmap column
  initial_price_pct: 5      # Price zoom (% of full range); 0 = full

  # Recording mode colour range in BTC (log scale): <= min dark, >= max brightest
  sensitivity_min: 0.05
  sensitivity_max: 50

bubbles:
  fill_opacity: 0.40
  max_radius: 18       # logical pixels, clamped to 4..48
  minimum_btc: 0.38    # BTC-USD base size; other products use equivalent quote value
  ring_width: 1        # logical pixels, clamped to 0..3
  ring_visible: true   # chart-background (#0F1114) ring

tpo:
  layout: collapsed   # collapsed (letters packed per session) | split (letters in their time column)
  theme: rainbow      # rainbow (period gradient) | calm (blue) | sage (green) | indigo (indigo -> sky)
  session: h24        # ny | london | asia | australia | h24 | w1 | m1 (calendar month, UTC)
  period_minutes: 30  # letter bracket; must divide the session (w1/m1: a UTC day)
  sessions: 5         # current session plus previous ones (1-8)
  row_px: 13          # price rows merge (1-2-5 ticks) until at least this tall

gui:
  api_port: 17100
  screenshot_dir: ./screenshots
  msdf_font: resources/fonts/RobotoMono/RobotoMono-Regular.ttf
  axis_label_px: 0  # <= 0 uses automatic monitor-scaled sizing

client:
  server:
    host: 127.0.0.1
    port: 8080
    ca_file: certs/sentinel-server.crt
